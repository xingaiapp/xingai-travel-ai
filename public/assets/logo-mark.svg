<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XingAI Travel mark</title>
  <desc id="desc">A flat indigo tile with a simple route and destination pin — travel decisions, not booking.</desc>
  <!-- Solid brand tile; no shadow, no paper-plane clutter. Reads at 28px. -->
  <rect x="48" y="48" width="416" height="416" rx="112" fill="#3B5BDB"/>
  <!-- Route -->
  <path
    d="M148 340C188 286 230 262 274 268C318 274 348 308 380 250"
    stroke="#FFFFFF"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Origin -->
  <circle cx="148" cy="340" r="28" fill="#FFFFFF"/>
  <!-- Destination pin -->
  <circle cx="380" cy="196" r="40" fill="#FFFFFF"/>
  <circle cx="380" cy="196" r="16" fill="#3B5BDB"/>
</svg>
